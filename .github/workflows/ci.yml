# Installs, typechecks, tests and builds on Windows and macOS. No window is opened and no secrets are needed.
name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The native binaries (koffi, the webview) must load on this system: the tests do not touch them.
      - run: node --input-type=module -e "await import('koffi'); await import('@webviewjs/webview'); console.log('native ok')"
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
      # The npm package (npx theblob), installed from the packed file into an empty folder. Not published here.
      - run: node scripts/pack.mjs
      - run: npm pack --silent
        working-directory: release/npm
      - run: node scripts/check-package.mjs release/npm/theblob-*.tgz
        shell: bash
