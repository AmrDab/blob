# Blob's phone relay. Placeholder name: it deploys to https://blob-relay.<your-subdomain>.workers.dev
# Build the phone page first (npm run build:phone): the Worker serves it at /phone/ and relays /room/<id>.
name = "blob-relay"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "../phone/dist"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "REPORTS"
class_name = "Reports"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Blob's private reports (src/reports.ts). Read them with the REPORTS_KEY secret: `npx wrangler secret put REPORTS_KEY`.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Reports"]
