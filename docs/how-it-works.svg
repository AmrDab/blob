<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" role="img" aria-labelledby="t d"
  font-family="Inter, -apple-system, 'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-size="14" fill="#1c1c1e">
  <title id="t">How Blob works</title>
  <desc id="d">You speak or type. Blob passes the request to your own Claude Code or Codex, which takes the fastest route in
    this order: know it, open it directly, a saved script, a command, file tools, an open app's window in the background,
    the screen last. Anything that changes something asks Yes first. Then Blob answers in one sentence and keeps the Log.
    It learns: memory, scripts, shortcuts and skills.</desc>
  <defs>
    <radialGradient id="lit" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="0.6" stop-color="#e9e9e9"/>
      <stop offset="1" stop-color="#d4d4d6"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1c1c1e" flood-opacity="0.16"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#77777d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- its own light background, so it reads the same on a dark page -->
  <rect x="1" y="1" width="878" height="578" rx="24" fill="#f6f6f7" stroke="#dcdcdf" stroke-width="2"/>

  <g fill="none" stroke="#77777d" stroke-width="1.8" stroke-linecap="round" marker-end="url(#tip)">
    <path d="M232 64 H276"/>
    <path d="M356 64 H398"/>
    <path d="M525 94 V150"/>
    <path d="M562 228 H598"/>
    <path d="M720 302 V336"/>
    <path d="M720 432 V474"/>
  </g>

  <!-- you -> Blob -> the brain -->
  <rect x="40" y="36" width="190" height="56" rx="18" fill="#ffffff" stroke="#dcdcdf"/>
  <text x="135" y="60" text-anchor="middle" font-weight="650">You</text>
  <text x="135" y="79" text-anchor="middle" font-size="13" fill="#5c5c62">speak or type</text>

  <circle cx="316" cy="64" r="34" fill="url(#lit)" filter="url(#soft)"/>
  <text x="316" y="69" text-anchor="middle" font-weight="700">Blob</text>

  <rect x="400" y="36" width="250" height="56" rx="18" fill="#ffffff" stroke="#dcdcdf"/>
  <text x="525" y="60" text-anchor="middle" font-weight="650">Your own Claude Code or Codex</text>
  <text x="525" y="79" text-anchor="middle" font-size="13" fill="#5c5c62">your plan, no API key</text>

  <text font-size="13" fill="#5c5c62">
    <tspan x="672" y="60">On Auto: Haiku first, then</tspan>
    <tspan x="672" y="78">Sonnet, Opus when stuck</tspan>
  </text>

  <!-- the fastest route -->
  <text x="40" y="136" font-weight="650">The fastest route, in this order</text>
  <g>
    <g fill="#e9e9e9">
      <rect x="40" y="156" width="520" height="36" rx="18"/>
      <rect x="40" y="198" width="520" height="36" rx="18"/>
      <rect x="40" y="240" width="520" height="36" rx="18"/>
      <rect x="40" y="282" width="520" height="36" rx="18"/>
      <rect x="40" y="324" width="520" height="36" rx="18"/>
      <rect x="40" y="366" width="520" height="36" rx="18"/>
      <rect x="40" y="408" width="520" height="36" rx="18"/>
    </g>
    <g fill="#1c1c1e">
      <circle cx="60" cy="174" r="12"/><circle cx="60" cy="216" r="12"/><circle cx="60" cy="258" r="12"/>
      <circle cx="60" cy="300" r="12"/><circle cx="60" cy="342" r="12"/><circle cx="60" cy="384" r="12"/>
      <circle cx="60" cy="426" r="12"/>
    </g>
    <g fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">
      <text x="60" y="178">1</text><text x="60" y="220">2</text><text x="60" y="262">3</text><text x="60" y="304">4</text>
      <text x="60" y="346">5</text><text x="60" y="388">6</text><text x="60" y="430">7</text>
    </g>
    <g font-weight="600">
      <text x="84" y="179">Know it</text>
      <text x="84" y="221">Open it directly</text>
      <text x="84" y="263">A saved script</text>
      <text x="84" y="305">A command</text>
      <text x="84" y="347">File tools</text>
      <text x="84" y="389">An open app's window, in the background</text>
      <text x="84" y="431">The screen</text>
    </g>
    <g font-size="13" fill="#5c5c62" text-anchor="end">
      <text x="542" y="179">nothing to touch</text>
      <text x="542" y="221">a link, a file, an app</text>
      <text x="542" y="263">one call</text>
      <text x="542" y="305">PowerShell or your shell</text>
      <text x="542" y="347">look, move, rename, bin</text>
      <text x="542" y="389">on Windows</text>
      <text x="542" y="431">the last resort</text>
    </g>
  </g>

  <!-- Yes before changes -->
  <rect x="600" y="156" width="240" height="144" rx="20" fill="url(#lit)" filter="url(#soft)"/>
  <text x="620" y="186" font-weight="700" font-size="15">Yes before changes</text>
  <text font-size="13" fill="#3a3a3c">
    <tspan x="620" y="209">Anything that changes</tspan>
    <tspan x="620" y="227">something is shown first,</tspan>
    <tspan x="620" y="245">word for word.</tspan>
  </text>
  <rect x="716" y="260" width="48" height="24" rx="12" fill="#1c1c1e" fill-opacity="0.08"/>
  <text x="740" y="277" text-anchor="middle" font-size="13" font-weight="600">No</text>
  <rect x="770" y="260" width="52" height="24" rx="12" fill="#1c1c1e"/>
  <text x="796" y="277" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Yes</text>

  <!-- the answer -->
  <rect x="600" y="340" width="240" height="90" rx="20" fill="#ffffff" stroke="#dcdcdf"/>
  <text x="620" y="370" font-weight="700" font-size="15">Done, in one sentence</text>
  <text font-size="13" fill="#5c5c62">
    <tspan x="620" y="393">Every step, and whether it</tspan>
    <tspan x="620" y="411">was confirmed, is in the Log.</tspan>
  </text>

  <!-- it learns -->
  <rect x="40" y="478" width="800" height="66" rx="20" fill="#e9e9e9"/>
  <text x="62" y="516" font-weight="700" font-size="15">It learns</text>
  <g>
    <rect x="150" y="490" width="150" height="42" rx="14" fill="#ffffff"/>
    <rect x="310" y="490" width="150" height="42" rx="14" fill="#ffffff"/>
    <rect x="470" y="490" width="180" height="42" rx="14" fill="#ffffff"/>
    <rect x="660" y="490" width="166" height="42" rx="14" fill="#ffffff"/>
  </g>
  <g font-weight="650" font-size="13">
    <text x="164" y="508">Memory</text>
    <text x="324" y="508">Scripts</text>
    <text x="484" y="508">Shortcuts</text>
    <text x="674" y="508">Skills</text>
  </g>
  <g font-size="12" fill="#5c5c62">
    <text x="164" y="524">facts, in a plain file</text>
    <text x="324" y="524">commands it saved</text>
    <text x="484" y="524">a task that worked 3 times</text>
    <text x="674" y="524">a multi-step recipe</text>
  </g>
</svg>
